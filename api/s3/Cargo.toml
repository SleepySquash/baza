[package]
name = "baza-api-s3"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
description = "S3 HTTP API implementation of Baza."
authors = ["Instrumentisto Team <developer@instrumentisto.com>"]
license = "BlueOak-1.0.0"
homepage = "https://github.com/SleepySquash/baza"
repository = "https://github.com/SleepySquash/baza"
publish = false

[dependencies]
base64-simd = "0.8"
baza = { package = "baza-lib", path = "../../lib" }
derive_more = { version = "2", features = ["display", "error", "from"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["http1", "http2", "server-auto", "tokio"] }
percent-encoding = "2.2"
s3s = "0.17"
secrecy = "0.10"
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tracing = "0.1"
