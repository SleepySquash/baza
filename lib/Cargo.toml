[package]
name = "baza-lib"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
description = "Actual Baza implementation as library."
authors = ["Instrumentisto Team <developer@instrumentisto.com>"]
license = "BlueOak-1.0.0"
homepage = "https://github.com/SleepySquash/baza"
repository = "https://github.com/SleepySquash/baza"
publish = false

[dependencies]
async-fs = "2.2"
async-trait = "0.1"
blocking = "1.3"
derive_more = { version = "2", features = ["display", "error"] }
futures = "0.3"
md5 = { package = "md-5", version = "0.11" }
tracerr = "0.5"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
