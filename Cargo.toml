[package]
name = "baza"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "Simply scalable files storage without much fuss."
authors = ["Instrumentisto Team <developer@instrumentisto.com>"]
license = "BlueOak-1.0.0"
homepage = "https://github.com/SleepySquash/baza"
repository = "https://github.com/SleepySquash/baza"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
[profile.dev]
split-debuginfo = "unpacked"

[dependencies]
baza = { package = "baza-lib", path = "lib" }
baza-api-s3 = { path = "api/s3" }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
humantime = "2"
secrecy = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace]
members = [
    "api/s3",
    "e2e",
    "lib",
]
